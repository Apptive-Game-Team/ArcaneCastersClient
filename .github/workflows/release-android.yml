name: Release Build (Android)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.0.0)'
        required: true
        type: string
      publish:
        description: 'Google Play internal track 에 업로드할지 여부'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-android-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  # ProjectSettings/ProjectVersion.txt 기준. release.yml 과 동일한 버전을 쓴다.
  UNITY_VERSION: 2022.3.34f1
  BUILD_NAME: WordOnlineClient
  PACKAGE_NAME: com.team6515.wordonline

jobs:
  build-android:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve tag and version name
        id: version
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::릴리스 태그를 확인할 수 없습니다."
            exit 1
          fi
          # versionName 은 태그에서 뽑는다. 태그가 v1.0.0 형태면 앞의 v 를 뗀다.
          VERSION_NAME="${TAG#v}"

          # Google Play 의 현재 production versionCode 는 13이고, 새 업로드는
          # 그보다 커야 한다. run_number 는 워크플로 실행마다 단조 증가하므로
          # 100 을 더해 여유를 두고 앞으로도 계속 13보다 크게 유지한다.
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Docker prune
        run: docker system prune -af

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      # androidKeystoreName 은 game-ci 가 컨테이너 안에 secret 을 풀어 쓰는
      # 파일 이름일 뿐이라 실제 keystore 파일 이름과 맞출 필요는 없다.
      # alias 이름은 upload 로 등록되어 있다.
      - name: Build Android App Bundle
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildName: ${{ env.BUILD_NAME }}
          buildsPath: build
          androidExportType: androidAppBundle
          androidKeystoreName: upload.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASSWORD }}
          versioning: Custom
          version: ${{ steps.version.outputs.version_name }}
          androidVersionCode: ${{ steps.version.outputs.version_code }}
          customParameters: -logFile -

      - name: Fix build output ownership
        run: sudo chown -R "$(id -u):$(id -g)" build

      - name: Locate built .aab
        id: aab
        run: |
          set -euo pipefail
          AAB_PATH=$(find build/Android -maxdepth 1 -name '*.aab' | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            echo "::error::빌드 결과에서 .aab 파일을 찾지 못했습니다."
            exit 1
          fi
          echo "path=$AAB_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-${{ steps.version.outputs.tag }}.aab
          path: ${{ steps.aab.outputs.path }}
          retention-days: 30

      # 업로드 키 재설정이 Google 승인 대기 중이라 지금은 Play 업로드가
      # 반드시 실패한다. workflow_dispatch 는 publish 입력(기본 false)으로,
      # release 트리거는 secret 존재 여부로만 건너뛴다. GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
      # 이 아직 이 저장소에 등록되지 않았으므로 지금은 어느 경로로 실행해도
      # 이 단계가 건너뛰어지고 빌드와 artifact 업로드까지만 검증된다.
      - name: Determine whether to publish to Play
        id: publish_gate
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          SHOULD_PUBLISH=false
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            if [ "${{ github.event_name }}" = "release" ]; then
              SHOULD_PUBLISH=true
            elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "true" ]; then
              SHOULD_PUBLISH=true
            fi
          fi
          echo "publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
          if [ "$SHOULD_PUBLISH" = "false" ]; then
            echo "Play 업로드를 건너뜁니다 (secret 미등록 또는 publish 입력이 false)."
          fi

      - name: Upload to Google Play (internal track)
        if: steps.publish_gate.outputs.publish == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: internal
