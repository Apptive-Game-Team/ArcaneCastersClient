name: Build and Deploy (Itch.io)

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # One job per itch.io channel. fail-fast is off so a broken desktop build
    # does not cancel the WebGL push, which is the one players hit first.
    # pushPath differs because unity-builder writes WebGL into a player
    # subdirectory (buildsPath/target/buildName) while the standalone targets
    # put the whole player directly under buildsPath/target.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: WebGL
            channel: webgl
            pushPath: build/WebGL/WebGL
          - target: StandaloneWindows64
            channel: windows
            pushPath: build/StandaloneWindows64
          - target: StandaloneOSX
            channel: osx
            pushPath: build/StandaloneOSX
          - target: StandaloneLinux64
            channel: linux
            pushPath: build/StandaloneLinux64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Butler unpacks butler, butler.zip, 7z.so and libc7zip.so next to itself.
      # Unpacking into the workspace leaves those as untracked files, and
      # game-ci/unity-builder refuses to build on a dirty branch because its
      # default semantic versioning reads the git tree. Keep them in the runner
      # temp directory and expose the binary through PATH instead.
      - name: Install Butler
        run: |
          curl -L -o "$RUNNER_TEMP/butler.zip" https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -o "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler-bin"
          chmod +x "$RUNNER_TEMP/butler-bin/butler"
          echo "$RUNNER_TEMP/butler-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/butler-bin/butler" -V

      # Verify the push target before the Unity build so credential and target
      # errors surface in a minute instead of after a full build.
      - name: Verify Itch.io credentials
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        run: butler status ${{ secrets.ITCH_USER }}/${{ secrets.ITCH_GAME }}:${{ matrix.channel }}

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Docker prune
        run: docker system prune -af

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.target }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.target }}-
            Library-

      - name: Set build defines based on branch
        id: build_defines
        run: |
          BRANCH="${{ github.ref_name }}"
          if [[ "$BRANCH" == "main" || "$BRANCH" == "deploy" ]]; then
            echo "CUSTOM_PARAMS=-logFile -" >> $GITHUB_OUTPUT
          else
            echo "CUSTOM_PARAMS=-logFile - -customDefines DEV_BUILD" >> $GITHUB_OUTPUT
          fi

      - name: Build ${{ matrix.target }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.22f1
          targetPlatform: ${{ matrix.target }}
          customParameters: ${{ steps.build_defines.outputs.CUSTOM_PARAMS }}

      # unity-builder runs Unity inside a Docker container as root, so the whole
      # build directory comes out root-owned while every later step runs as the
      # runner user. That is what failed the windows and osx channels on every
      # run up to 2026-09-21: chmod reported "Operation not permitted" and rm
      # reported "Permission denied", both before the push. release.yml takes
      # ownership back the same way in its Package build step.
      - name: Take ownership of the build output
        run: sudo chown -R "$(id -u):$(id -g)" build

      # A macOS player built on Linux comes out without the executable bit on
      # the binary inside the .app, and butler preserves what it is given, so
      # the upload would refuse to launch. The build is also unsigned and not
      # notarized; Gatekeeper has to be bypassed manually on first launch.
      - name: Restore macOS executable bit
        if: matrix.target == 'StandaloneOSX'
        run: chmod -R +x ${{ matrix.pushPath }}/*.app/Contents/MacOS

      # unity-builder names the Linux player after buildName, which defaults to
      # the target name, and Unity appends .x86_64 on some versions. Check both
      # spellings instead of guessing. A player that ships without the bit still
      # uploads and still runs after a manual chmod, so warn rather than fail
      # the push, and list the directory so the real name lands in the log.
      - name: Restore Linux executable bit
        if: matrix.target == 'StandaloneLinux64'
        run: |
          set -euo pipefail
          chmodded=0
          for candidate in "${{ matrix.pushPath }}/${{ matrix.target }}" \
                           "${{ matrix.pushPath }}/${{ matrix.target }}.x86_64"; do
            if [ -f "$candidate" ]; then
              chmod +x "$candidate"
              chmodded=1
            fi
          done
          if [ "$chmodded" != 1 ]; then
            echo "::warning::no Linux player found under ${{ matrix.pushPath }}; whoever downloads it has to chmod +x by hand"
            ls -la "${{ matrix.pushPath }}"
          fi

      # Unity drops Burst debug symbols beside the standalone player in a
      # folder it names DoNotShip, and the push path is the whole target
      # directory, so the upload would carry them. Verified on a local macOS
      # build: the folder sits next to the .app.
      - name: Drop Burst debug symbols
        if: matrix.target != 'WebGL'
        run: rm -rf ${{ matrix.pushPath }}/*_BurstDebugInformation_DoNotShip

      - name: Push to Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        run: butler push ${{ matrix.pushPath }} ${{ secrets.ITCH_USER }}/${{ secrets.ITCH_GAME }}:${{ matrix.channel }}
