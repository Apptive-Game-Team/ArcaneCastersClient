name: Build and Publish WebGL Image

on:
  push:
    branches:
      - dev
      - deploy
  workflow_dispatch:

concurrency:
  group: webgl-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  buildWebGL:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Docker prune
        run: docker system prune -af

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: WebGL
          buildName: WebGL
          buildMethod: ${{ github.ref == 'refs/heads/deploy' && 'BuildScript.BuildWebGL' || 'BuildScript.BuildDevWebGL' }}
          customParameters: -logFile -

      - name: Build and verify Nginx image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/arcanecasters-play
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          echo "PLAY_IMAGE=$image" >> "$GITHUB_ENV"
          bash deploy/web/build-image.sh "$image:sha-$GITHUB_SHA" build/WebGL/WebGL
          bash deploy/web/check-image.sh "$image:sha-$GITHUB_SHA" build/WebGL/WebGL

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        run: |
          set -euo pipefail
          docker push "$PLAY_IMAGE:sha-$GITHUB_SHA"
          docker tag "$PLAY_IMAGE:sha-$GITHUB_SHA" "$PLAY_IMAGE:$GITHUB_REF_NAME"
          docker push "$PLAY_IMAGE:$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_NAME" = deploy ]; then
            docker tag "$PLAY_IMAGE:sha-$GITHUB_SHA" "$PLAY_IMAGE:latest"
            docker push "$PLAY_IMAGE:latest"
          fi
          echo "Play image: \`$PLAY_IMAGE:sha-$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
