map $uri $unity_encoding {
    default "";
    ~\.gz$ gzip;
    ~\.br$ br;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    gzip off;
    add_header Cache-Control "no-cache" always;
    add_header Content-Encoding $unity_encoding;

    location ~ /\. { return 404; }

    location ~ \.wasm(?:\.gz|\.br)?$ {
        types { }
        default_type application/wasm;
        try_files $uri =404;
    }
    location ~ \.js(?:\.gz|\.br)?$ {
        types { }
        default_type application/javascript;
        try_files $uri =404;
    }
    location ~ \.(?:data|symbols\.json)(?:\.gz|\.br)?$ {
        types { }
        default_type application/octet-stream;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
